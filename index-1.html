<script>
const T={"lt": {"lang_name": "Lietuvių", "title": "Evita Luxury Apartments – Near Playa Los Locos Beach with Pool", "subtitle": "Svečių informacija ir namų taisyklės", "intro": "Sveiki atvykę! Prašome skirti kelias minutes šiai informacijai perskaityti. Ji padės patogiai naudotis apartamentu ir išvengti nesusipratimų.", "important_title": "Svarbiausia", "important": ["Ramybės laikas: 22:00–08:00.", "Rūkyti galima tik balkone. Apartamento viduje draudžiama rūkyti ir naudoti elektronines cigaretes / vape.", "Nakvoti gali tik rezervacijoje registruoti svečiai. Neregistruotas svečias: 200 € už naktį vienam asmeniui.", "Išvykimas – iki 11:00.", "Durų, kamerų, ventiliacijos ir kitų techninių įrenginių negalima gadinti, uždengti ar savavališkai atjungti."], "sections": [["Ramybė, balkonas ir kaimynai", ["Balkonas skirtas ramiam poilsiui. Jame prašome garsiai neleisti muzikos, nešokti ir neorganizuoti triukšmingų susibūrimų.", "Norint klausytis garsios muzikos ar linksmintis, rinkitės tam skirtas vietas – barus, klubus ar kitas pramogų erdves.", "Ramybės laikas 22:00–08:00 galioja ir balkone, koridoriuose bei bendrose erdvėse.", "Draudžiama mėtyti daiktus, nuorūkas, pelenus ar šiukšles iš balkono."]], ["Registruoti svečiai ir apartamento paskirtis", ["Apartamentas skirtas gyvenimui ir poilsiui tik rezervacijoje nurodytiems bei registruotiems svečiams.", "Papildomi nakvojantys asmenys leidžiami tik iš anksto suderinus su šeimininku. Neregistruotas svečias: 200 € už naktį vienam asmeniui.", "Apartamente draudžiama teikti, pirkti ar organizuoti komercines seksualines paslaugas ar naudoti apartamentą panašiai veiklai. Rimti taisyklių pažeidimai gali lemti viešnagės nutraukimą pagal rezervacijos sąlygas."]], ["Rūkymas ir gyvūnai", ["Rūkyti leidžiama tik balkone.", "Apartamento viduje griežtai draudžiama rūkyti įprastas cigaretes, elektronines cigaretes ar naudoti vape įrenginius.", "Gyvūnai neleidžiami."]], ["Lauko avalynė ir vabzdžių prevencija", ["Lauko avalynės apartamente nedėvėkite. Su batais į vidų patenka smėlis, gatvės nešvarumai, taip pat gali patekti vabzdžių ar jų kiaušinėlių.", "Šiltame Ispanijos klimate, ypač netoli jūros ir vandens, tarakonai bei kiti vabzdžiai lauke ir bendrose pastato zonose gali pasitaikyti.", "Pastate periodiškai atliekama kenkėjų kontrolė, o apartamentas papildomai profilaktiškai dezinsekuojamas maždaug kas 3 mėnesius ir pagal poreikį.", "Pastebėję vabzdžių apartamente, kuo greičiau susisiekite su šeimininku."]], ["Balkono durys ir užuolaidos", ["Prieš uždarydami balkono duris įsitikinkite, kad tarp durų ir rėmo nepateko dieninė ar naktinė užuolaida.", "Prispausta užuolaida gali būti suplėšyta ar nepataisomai sugadinta. Už dėl netinkamo naudojimo padarytą žalą gali būti taikoma inventoriaus kainyne nurodyta kompensacija."]], ["Kondicionierius ir oro cirkuliacija", ["Apartamente įrengta ortakinė oro kondicionavimo sistema. Oras į patalpas tiekiamas per sienose ir lubose esančias groteles – atskirų sieninių kondicionierių kiekviename kambaryje nėra.", "Rekomenduojamas COOL / ❄ režimas ir +24–25 °C. Jei per šalta – temperatūrą padidinkite, jei per šilta – sumažinkite.", "Naudojant kondicionierių langai ir balkono durys turi būti uždaryti.", "Ventiliacijos grotelių, jutiklių ir kitų sistemos dalių neuždenkite ir nereguliuokite rankomis."]], ["Vonios kambarys", ["Po dušo vonios langą rekomenduojama laikyti pravirą, kad nesikauptų drėgmė. Vonios duris tuo metu laikykite uždarytas, kad drėgmė ir šiluma nepatektų į likusią apartamento dalį.", "Veidrodyje yra šildymo / rasojimo pašalinimo funkcija. Ją įjungus veidrodis sušyla ir po dušo vėl tampa gerai matomas."]], ["Vandens naudojimas", ["Prašome vandeniu naudotis atsakingai ir nepalikti jo be reikalo tekančio.", "Apartamente sunaudojamo vandens kiekis yra apskaitomas, todėl bendras suvartojimas viešnagės metu yra matomas. Tai nereiškia, kad stebima, kada ar kaip naudojate vandenį – matomas tik bendras sunaudotas kiekis.", "Įprastas vieno žmogaus vandens poreikis per parą, įskaitant dušą, indų plovimą, skalbimą ir kitus buitinius poreikius, yra žinomas, todėl neįprastai didelis suvartojimas gali būti pastebėtas.", "Pastebėję vandens nuotėkį, užsukite vonioje esančią avarinę vandens sklendę (kairėje virš veidrodžio, jei pažymėta) ir nedelsdami susisiekite su šeimininku."]], ["Elektros ir techniniai įrenginiai", ["Savavališkai neatjunkite iš elektros lizdų maršrutizatoriaus, Wi‑Fi stiprintuvų, kamerų ar kitos techninės įrangos. Šie įrenginiai turi likti prijungti visos viešnagės metu.", "Jei įrenginį reikia atjungti dėl gedimo, pirmiausia susisiekite su šeimininku.", "LED apšvietimas valdomas mažu juodu pulteliu. Nukreipkite jį į kampą virš televizoriaus ir pasirinkite norimą spalvą ar režimą."]], ["Kavos aparatas", ["Kavos aparatui naudokite tik geriamąjį vandenį iš parduotuvės – ne vandenį iš čiaupo.", "Įpilkite vandens į talpyklą, įdėkite kapsulę ir uždarykite aparato dureles.", "Paspauskite norimo puodelio dydžio mygtuką ir palaukite, kol jis nustos mirksėti. Tuomet paspauskite tą patį mygtuką dar kartą – kava pradės bėgti į puodelį.", "Tinkamų kapsulių galima įsigyti daugelyje parduotuvių. Patogiausia nusifotografuoti naudojamos kapsulės tipą ir parduotuvėje rinktis tokį patį."]], ["Lygintuvas", ["Į lygintuvo vandens talpyklą pilkite tik distiliuotą vandenį. Vanduo iš čiaupo gali užkimšti garų angas kalkėmis ir sugadinti lygintuvą."]], ["Virtuvės stalviršis", ["Ant stalviršio draudžiama pjaustyti maistą tiesiogiai. Visada naudokite tam skirtą pjaustymo lentelę.", "Įbrėžus, įpjovus ar kitaip sugadinus stalviršį gali būti taikomos faktinės remonto arba pakeitimo išlaidos."]], ["Paplūdimio inventorius", ["Apartamente esantys paplūdimio skėčiai, kėdės, žaislai ir kitas inventorius yra skirti visiems svečiams.", "Po naudojimo nuplaukite smėlį ir nešvarumus, leiskite daiktams išdžiūti ir tik tada juos sudėkite.", "Nesuvyniokite ir nepadėkite šlapių daiktų – dėl drėgmės jie gali supelyti ir atsirasti nemalonus kvapas.", "Grąžinkite inventorių į jo vietą, kad juo galėtų naudotis kiti svečiai."]], ["Bendras lauko baseinas", ["Lauko baseinas nėra privataus apartamento dalis – tai bendro naudojimo pastato bendrijos baseinas.", "Jo priežiūra, vandens būklė, darbo režimas, gelbėtojas, baldai ir bendros erdvės nėra tiesiogiai kontroliuojami apartamento savininko.", "Prie baseino gultai leidžiami, tačiau dėl ribotos vietos apartamente nuolatiniai gultai nelaikomi. Jei norite, nebrangų pripučiamą ar sulankstomą gultą galima įsigyti vietinėse parduotuvėse."]], ["Vieta, miesto garsai ir vaizdas", ["Apartamentai yra gyvenamajame pastate patrauklioje vietoje netoli Playa Los Locos. Tai nėra izoliuotas kurortas ar miesto centras.", "Kaip ir kitose gyvenamosiose miesto vietose, kartais gali būti girdimi šiukšlių surinkimo automobiliai, transportas, kaimynai, šunys ar kiti įprasti miesto garsai. Uždarius langus išorės garsai gerokai sumažėja.", "Apartamentai nereklamuojami kaip turintys tiesioginį vaizdą į jūrą. Skelbimo nuotraukos ir aprašymas rodo faktinę apartamento vietą bei aplinką."]], ["Durys ir išmanioji spyna", ["Įvedę 6 skaitmenų durų kodą palaukite maždaug 1–3 sekundes. Spyna atsirakins automatiškai ir durys gali šiek tiek prasiverti.", "Nestumkite ir netraukite durų per jėgą – taip galima sugadinti automatinį užrakto mechanizmą.", "Koridoriaus šviesa įjungiama rankiniu būdu sieniniais jungikliais."]], ["Saugumo kameros ir privatumas", ["Prie apartamento įėjimo naudojamos dvi saugumo kameros. Jos stebi tik įėjimo / prieigos zoną. Apartamento viduje kamerų nėra.", "Kameros naudojamos registruotų svečių atvykimui patvirtinti, nustatyti neregistruotų pašalinių asmenų patekimą ir apsaugoti apartamento turtą.", "Kameras uždengti, išjungti, pasukti ar kitaip trukdyti jų veikimui griežtai draudžiama. Sąmoningas saugumo sistemos trikdymas gali būti laikomas rimtu namų taisyklių pažeidimu ir gali lemti viešnagės nutraukimą pagal rezervacijos sąlygas.", "Jei nėra incidento, ginčo ar pagrįsto poreikio įrodymams išsaugoti, įrašai po viešnagės nėra saugomi ilgiau nei būtina ir pagal sistemos nustatymus ištrinami.", "Durų išmanioji spyna gali registruoti atidarymo ir uždarymo įvykius saugumo ir taisyklių laikymosi tikslais."]], ["Spausdintuvas", ["Apartamente esantį spausdintuvą galima naudoti informacijai ar asmeniniams dokumentams atsispausdinti / nusikopijuoti.", "Naudokite jį atsargiai. Sugadinus įrenginį dėl netinkamo naudojimo, remonto ar pakeitimo išlaidos gali būti padengiamos iš užstato."]], ["Užstatas, žala ir turto apsauga", ["250 € užstatas yra grąžinamas, jei po viešnagės nėra pagrįstų išskaitų. Jis nėra tik formalus rezervacijos užstatas – prireikus gali būti panaudotas pagrįstoms žalos, trūkstamo turto, papildomo valymo, neregistruotų svečių ar kitoms pagal taisykles atsiradusioms išlaidoms padengti.", "Jei išlaidos viršija užstato sumą, gali būti prašoma padengti likusią pagrįstą žalą.", "Prieš perduodant apartamentą svečiams jo būklė ir inventorius dokumentuojami nuotraukomis ir / arba vaizdo įrašu, kad būtų užfiksuota būklė prieš atvykimą.", "Įtarus vagystę ar tyčinį turto pasisavinimą, apie tai gali būti pranešta policijai."]], ["Išvykimas", ["Išvykimo laikas – iki 11:00. Iki šio laiko apartamentas turi būti visiškai atlaisvintas, kad valymo personalas galėtų pradėti darbą.", "Prieš išeidami išjunkite nereikalingas šviesas ir kondicionierių, uždarykite langus bei balkono duris, pasiimkite asmeninius daiktus ir palikite inventorių jo vietoje.", "Pavėlavus išvykti gali būti taikomos papildomos išlaidos, jei dėl vėlavimo valymo įmonė ar kitas personalas patiria papildomų kaštų."]], ["Inventoriaus sugadinimas ar praradimas", ["Nurodytos kompensacijos nėra vien tik prekės kaina parduotuvėje. Į sumą gali būti įtrauktas personalo laikas, kelionė ir kuras, daikto paieška ir pirkimas, pristatymas, meistro iškvietimas, išmontavimas, montavimas, papildomas valymas ir kitos realios pakeitimo išlaidos.", "Jei netyčia sugadinote ar sudaužėte daiktą, pirmiausia susisiekite su šeimininku. Jei įmanoma, prieš tai suderinę galite patys nupirkti tokį patį ar tinkamą pakaitalą ir taip išvengti dalies papildomų pakeitimo išlaidų."]]], "inventory_title": "Inventoriaus ir galimų nuostolių kainynas", "inventory": [["Raktai ir prieiga", [["Žetonas", "50 €"], ["Išmani durų spyna", "500 €"], ["Įsilaužimas į užrakintą spintelę", "250 €"]]], ["Elektronika ir ryšys", [["Televizorius", "300 €"], ["TV pultas", "30 €"], ["Kondicionieriaus pultas", "80 €"], ["Wi‑Fi stiprintuvas", "50 €"], ["Saugumo kamera", "250 €"], ["Domofonas", "300 €"], ["Spausdintuvas", "pagal faktines remonto / pakeitimo išlaidas"]]], ["Virtuvės technika", [["Kaitlentė", "600 €"], ["Orkaitė", "800 €"], ["Šaldytuvas", "300 €"], ["Indaplovė", "250 €"], ["Mikrobangų krosnelė", "100 €"], ["Virdulys", "80 €"], ["Kavos aparatas", "150 €"]]], ["Vonios ir buitinė technika", [["Skalbimo mašina", "300 €"], ["Skalbinių džiovyklė", "50 €"], ["Plaukų džiovintuvas", "60 €"], ["Lygintuvas", "80 €"], ["Ventiliatorius", "150 €"], ["Vonios kambario dispenseris", "20 €"]]], ["Baldai", [["Sofa (sugadinta / sulaužyta)", "800 €"], ["Sofa-lova (giluminis valymas dėl stipraus sutepimo)", "150 €"], ["Viengulė lova", "250 €"], ["Dvigulė lova", "800 €"], ["Stalas (sulaužytas)", "300 €"], ["Staliukas salone", "80 €"], ["Naktinis staliukas", "50 €"], ["Kosmetinė kėdė", "50 €"], ["Balkono kėdė", "50 €"], ["Lauko stalas", "80 €"], ["Batų dėžė", "50 €"], ["Kosmetinis staliukas", "250 €"]]], ["Interjeras", [["Sudaužytas veidrodis", "150 €"], ["Išdaužtas langas ar stiklas", "600 €"], ["Vaza", "20 €"], ["Šviestuvas", "100 €"], ["LED lempa", "20 €"], ["Paveikslas mažas", "50 €"], ["Paveikslas didelis", "100 €"], ["Dirbtinė gėlė", "50 €"]]], ["Užuolaidos", [["Dieninė užuolaida", "100 €"], ["Naktinė užuolaida", "300 €"], ["Užuolaidų laikiklis", "25 €"]]], ["Virtuvės indai", [["Indai", "50–100 €"], ["Smulkūs virtuvės indai", "20 €"], ["Valgomojo stalo stiklas", "50 €"], ["Keptuvė", "80 €"], ["Sudegintas puodas", "150 €"]]], ["Tekstilė", [["Rankšluostis", "30 €"], ["Nepataisomai sugadinta patalynė", "100 €"], ["Lovos užtiesalas", "100 €"], ["Suplėšyta pagalvė", "50 €"], ["Suplėšytas kėdės paminkštinimas", "50 €"], ["Lauko baldų užtiesalas", "30 €"]]], ["Kita įranga", [["Batų šaukštas", "25 €"], ["Dulkių siurblys", "250 €"], ["Sulaužyta šiukšlių dėžė", "20 €"]]]], "emergency": "Skubios pagalbos numeris Ispanijoje: 112", "contact": "Jei kyla problema ar kažkas neveikia, prašome susisiekti su šeimininku kuo greičiau – geriausia problemą išspręsti viešnagės metu."}, "en": {"lang_name": "English", "title": "Evita Luxury Apartments – Near Playa Los Locos Beach with Pool", "subtitle": "Guest information & house rules", "intro": "Welcome! Please take a few minutes to read this information. It will help you use the apartment comfortably and avoid misunderstandings.", "important_title": "Most important", "important": ["Quiet hours: 22:00–08:00.", "Smoking is allowed only on the balcony. Smoking or vaping inside the apartment is strictly prohibited.", "Only registered guests may stay overnight. Unregistered guest: €200 per night, per person.", "Check-out is by 11:00.", "Do not damage, cover or disconnect doors, cameras, ventilation or other technical equipment."], "sections": [["Quiet hours, balcony and neighbours", ["The balcony is intended for quiet relaxation. Please do not play loud music, dance or hold noisy gatherings there.", "For loud music or nightlife, please use bars, clubs or other entertainment venues.", "Quiet hours from 22:00 to 08:00 also apply to the balcony, corridors and common areas.", "Do not throw objects, cigarette butts, ash or rubbish from the balcony."]], ["Registered guests and purpose of the apartment", ["The apartment is intended for accommodation and relaxation only for guests listed and registered in the reservation.", "Additional overnight guests are allowed only with prior approval from the host. Unregistered guest: €200 per night, per person.", "Commercial sexual services, prostitution or similar commercial activity are strictly prohibited in the apartment. Serious breaches may lead to termination of the stay in accordance with the booking conditions."]], ["Smoking and pets", ["Smoking is permitted only on the balcony.", "Smoking cigarettes, e-cigarettes or vaping inside the apartment is strictly prohibited.", "Pets are not allowed."]], ["Outdoor shoes and pest prevention", ["Please do not wear outdoor shoes inside the apartment. Shoes bring in sand, street dirt and may also carry insects or their eggs.", "In the warm Spanish climate, especially close to the sea and water, cockroaches and other insects may occasionally be present outdoors or in common building areas.", "The building receives periodic pest-control treatment, and the apartment is additionally treated preventively approximately every three months and when needed.", "If you notice insects inside the apartment, please contact the host as soon as possible."]], ["Balcony doors and curtains", ["Before closing the balcony doors, make sure that neither the sheer nor blackout curtain is caught between the door and the frame.", "A trapped curtain can be torn or damaged beyond repair. Damage caused by improper use may be charged according to the inventory list."]], ["Air conditioning and air circulation", ["The apartment has a ducted air-conditioning system. Air is supplied through vents in the walls and ceilings, so there is no separate wall-mounted AC unit in every room.", "Recommended setting: COOL / ❄ mode at around 24–25 °C. If it feels too cold, increase the temperature; if too warm, lower it.", "Keep windows and balcony doors closed while the air conditioning is running.", "Do not cover or manually adjust ventilation grilles, sensors or other system components."]], ["Bathroom", ["After showering, it is recommended to keep the bathroom window slightly open to prevent moisture build-up. Keep the bathroom door closed so heat and humidity do not spread through the apartment.", "The mirror has a heating / anti-fog function. Switch it on to warm the mirror and clear condensation after a shower."]], ["Water use", ["Please use water responsibly and do not leave it running unnecessarily.", "Apartment water consumption is metered, so total usage during a stay is visible. This does not mean that anyone monitors when or how you use water – only the total amount consumed is recorded.", "Normal daily household water use per person, including showers, washing dishes, laundry and other needs, is well understood, so unusually high consumption can be noticed.", "If you notice a leak, close the emergency water valve in the bathroom (left side above the mirror, where marked) and contact the host immediately."]], ["Electrical and technical equipment", ["Do not unplug the router, Wi‑Fi boosters, cameras or other technical equipment without permission. These devices must remain connected during the stay.", "If something needs to be disconnected because of a fault, contact the host first.", "Decorative LED lighting is controlled with the small black remote. Point it toward the corner above the TV and select the desired colour or mode."]], ["Coffee machine", ["Use only bottled drinking water in the coffee machine – not tap water.", "Fill the water tank, insert a capsule and close the machine.", "Press the button for the desired cup size and wait until it stops flashing. Then press the same button again and the coffee will start flowing.", "Compatible capsules are available in many shops. Taking a photo of the capsule type is the easiest way to buy the correct one."]], ["Iron", ["Use only distilled water in the iron's water tank. Tap water can cause limescale, block the steam holes and damage the iron."]], ["Kitchen worktop", ["Do not cut food directly on the worktop. Always use the cutting boards provided.", "Scratches, cuts or other damage may result in actual repair or replacement costs."]], ["Beach equipment", ["Beach umbrellas, chairs, toys and other beach items in the apartment are provided for all guests.", "After use, rinse off sand and dirt, allow items to dry, and only then put them away.", "Do not roll up or store wet items, as they may develop mould and unpleasant odours.", "Return all items to their designated place so future guests can use them."]], ["Shared outdoor pool", ["The outdoor pool is not a private part of the apartment; it is a shared community pool managed by the building community.", "Its maintenance, water condition, opening arrangements, lifeguard, furniture and common areas are not directly controlled by the apartment owner.", "Sun loungers are allowed by the pool, but due to limited storage space no permanent loungers are kept in the apartment. Inexpensive inflatable or folding loungers can be purchased locally if desired."]], ["Location, city noise and view", ["The apartment is in a residential building in an attractive area near Playa Los Locos. It is not an isolated resort or the city centre.", "As in other residential urban areas, you may sometimes hear rubbish collection vehicles, traffic, neighbours, dogs or other normal city sounds. Closing the windows significantly reduces outside noise.", "The apartment is not advertised as having a direct sea view. The listing photos and description show the actual apartment location and surroundings."]], ["Door and smart lock", ["After entering the 6-digit door code, wait approximately 1–3 seconds. The lock will release automatically and the door may open slightly by itself.", "Do not push or pull the door by force, as this can damage the automatic lock system.", "Corridor lighting is switched on manually using wall switches."]], ["Security cameras and privacy", ["Two security cameras are used at the apartment entrance. They monitor only the entrance/access area. There are no cameras inside the apartment.", "They are used to confirm the arrival of registered guests, identify access by unregistered persons and protect apartment property.", "Covering, disconnecting, turning or otherwise interfering with the cameras is strictly prohibited. Deliberate interference with the security system may be treated as a serious breach and may lead to termination of the stay in accordance with the booking conditions.", "If there is no incident, dispute or justified need to preserve evidence, recordings are not kept longer than necessary after the stay and are deleted according to the system settings.", "The smart lock may log door opening and closing events for security and rule-compliance purposes."]], ["Printer", ["The apartment printer may be used to print or copy personal documents and useful information.", "Please use it carefully. Damage caused by improper use may be charged against the security deposit based on actual repair or replacement costs."]], ["Security deposit, damage and property protection", ["The €250 security deposit is refundable when there are no justified deductions after the stay. It is not merely a formal booking hold: where necessary it may be used toward justified costs for damage, missing property, additional cleaning, unregistered guests or other costs arising under these rules.", "If justified costs exceed the deposit, payment of the remaining amount may be requested.", "Before the apartment is handed over to guests, its condition and inventory are documented with photos and/or video to record the condition before arrival.", "Suspected theft or deliberate removal of property may be reported to the police."]], ["Check-out", ["Check-out is by 11:00. The apartment must be fully vacated by that time so cleaning staff can start work.", "Before leaving, switch off unnecessary lights and air conditioning, close windows and balcony doors, take your personal belongings and return apartment items to their place.", "Late departure may result in additional charges when it causes extra costs for the cleaning company or other staff."]], ["Damage or loss of inventory", ["The listed compensation amounts are not simply the retail price of an item. They may include staff time, travel and fuel, sourcing and purchasing the replacement, delivery, technician call-out, removal, installation, extra cleaning and other genuine replacement costs.", "If you accidentally damage or break something, contact the host first. Where possible, and after agreement with the host, you may purchase an identical or suitable replacement yourself and avoid some additional replacement costs."]]], "inventory_title": "Inventory and possible loss/damage charges", "inventory": [["Keys and access", [["Access token / fob", "€50"], ["Smart door lock", "€500"], ["Forced entry into locked cabinet", "€250"]]], ["Electronics and connectivity", [["Television", "€300"], ["TV remote", "€30"], ["Air-conditioning remote", "€80"], ["Wi‑Fi booster", "€50"], ["Security camera", "€250"], ["Intercom", "€300"], ["Printer", "actual repair / replacement cost"]]], ["Kitchen appliances", [["Hob", "€600"], ["Oven", "€800"], ["Refrigerator", "€300"], ["Dishwasher", "€250"], ["Microwave", "€100"], ["Kettle", "€80"], ["Coffee machine", "€150"]]], ["Bathroom and household equipment", [["Washing machine", "€300"], ["Clothes drying rack / dryer", "€50"], ["Hair dryer", "€60"], ["Iron", "€80"], ["Fan", "€150"], ["Bathroom dispenser", "€20"]]], ["Furniture", [["Sofa – damaged / broken", "€800"], ["Sofa bed – deep cleaning due to heavy soiling", "€150"], ["Single bed", "€250"], ["Double bed", "€800"], ["Table – broken", "€300"], ["Living-room side table", "€80"], ["Bedside table", "€50"], ["Vanity chair", "€50"], ["Balcony chair", "€50"], ["Outdoor table", "€80"], ["Shoe storage box", "€50"], ["Vanity / dressing table", "€250"]]], ["Interior", [["Broken mirror", "€150"], ["Broken window or glass", "€600"], ["Vase", "€20"], ["Light fixture", "€100"], ["LED lamp", "€20"], ["Small picture", "€50"], ["Large picture", "€100"], ["Artificial flower", "€50"]]], ["Curtains", [["Sheer curtain", "€100"], ["Blackout curtain", "€300"], ["Curtain holder", "€25"]]], ["Kitchenware", [["Dishes", "€50–100"], ["Small kitchen utensils", "€20"], ["Dining-table glass", "€50"], ["Frying pan", "€80"], ["Burnt saucepan / pot", "€150"]]], ["Textiles", [["Towel", "€30"], ["Irreparably damaged bed linen", "€100"], ["Bedspread", "€100"], ["Torn pillow", "€50"], ["Torn chair cushion", "€50"], ["Outdoor furniture cover", "€30"]]], ["Other equipment", [["Shoehorn", "€25"], ["Vacuum cleaner", "€250"], ["Broken rubbish bin", "€20"]]]], "emergency": "Emergency number in Spain: 112", "contact": "If there is a problem or something does not work, please contact the host as soon as possible. It is much better to resolve a problem during the stay."}, "es": {"lang_name": "Español", "title": "Evita Luxury Apartments – Near Playa Los Locos Beach with Pool", "subtitle": "Información para huéspedes y normas de la casa", "intro": "¡Bienvenido! Dedique unos minutos a leer esta información. Le ayudará a utilizar el apartamento correctamente y a evitar malentendidos.", "important_title": "Lo más importante", "important": ["Horario de silencio: 22:00–08:00.", "Solo se permite fumar en el balcón. Está estrictamente prohibido fumar o vapear dentro del apartamento.", "Solo pueden alojarse las personas registradas en la reserva. Huésped no registrado: 200 € por noche y persona.", "Check-out hasta las 11:00.", "No dañe, cubra ni desconecte puertas, cámaras, ventilación u otros equipos técnicos."], "sections": [["Silencio, balcón y vecinos", ["El balcón está destinado al descanso tranquilo. No ponga música alta, no baile ni organice reuniones ruidosas.", "Para escuchar música alta o salir de fiesta, utilice bares, clubes u otros lugares de ocio.", "El horario de silencio de 22:00 a 08:00 también se aplica al balcón, pasillos y zonas comunes.", "No arroje objetos, colillas, cenizas ni basura desde el balcón."]], ["Huéspedes registrados y uso del apartamento", ["El apartamento está destinado al alojamiento y descanso únicamente de las personas incluidas y registradas en la reserva.", "Los huéspedes adicionales que se queden a dormir requieren autorización previa del anfitrión. Huésped no registrado: 200 € por noche y persona.", "Está prohibido prestar, comprar u organizar servicios sexuales comerciales, prostitución o actividades similares en el apartamento. Las infracciones graves pueden dar lugar a la finalización de la estancia conforme a las condiciones de la reserva."]], ["Fumar y mascotas", ["Solo está permitido fumar en el balcón.", "Está estrictamente prohibido fumar cigarrillos, cigarrillos electrónicos o vapear dentro del apartamento.", "No se permiten mascotas."]], ["Calzado exterior y prevención de insectos", ["No use calzado de exterior dentro del apartamento. El calzado introduce arena, suciedad de la calle y también puede transportar insectos o sus huevos.", "En el clima cálido de España, especialmente cerca del mar y del agua, pueden aparecer ocasionalmente cucarachas u otros insectos en el exterior o en las zonas comunes del edificio.", "El edificio recibe tratamientos periódicos de control de plagas y el apartamento se trata adicionalmente de forma preventiva aproximadamente cada tres meses y cuando es necesario.", "Si observa insectos dentro del apartamento, contacte con el anfitrión lo antes posible."]], ["Puertas del balcón y cortinas", ["Antes de cerrar las puertas del balcón, compruebe que ninguna cortina, ni de día ni opaca, haya quedado atrapada entre la puerta y el marco.", "Una cortina atrapada puede romperse o dañarse de forma irreparable. Los daños por uso incorrecto pueden cobrarse según la lista de inventario."]], ["Aire acondicionado y circulación de aire", ["El apartamento dispone de un sistema de aire acondicionado por conductos. El aire llega a las habitaciones a través de rejillas en paredes y techos, por lo que no hay una unidad independiente en cada habitación.", "Se recomienda el modo COOL / ❄ y una temperatura de aproximadamente 24–25 °C. Si tiene frío, suba la temperatura; si tiene calor, bájela.", "Mantenga ventanas y puertas del balcón cerradas mientras funciona el aire acondicionado.", "No cubra ni ajuste manualmente las rejillas, sensores u otros componentes del sistema."]], ["Baño", ["Después de ducharse se recomienda dejar la ventana del baño ligeramente abierta para evitar la acumulación de humedad. Mantenga la puerta del baño cerrada para que el calor y la humedad no pasen al resto del apartamento.", "El espejo dispone de función de calefacción / antivaho. Al activarla, el espejo se calienta y elimina la condensación."]], ["Uso del agua", ["Utilice el agua de forma responsable y no la deje correr innecesariamente.", "El consumo de agua del apartamento se mide, por lo que puede verse el consumo total durante la estancia. Esto no significa que se controle cuándo o cómo utiliza el agua: solo se registra la cantidad total consumida.", "Se conoce el consumo doméstico normal por persona, incluyendo ducha, lavado de platos, lavadora y otros usos, por lo que un consumo anormalmente alto puede detectarse.", "Si observa una fuga, cierre la válvula de emergencia del baño (lado izquierdo sobre el espejo, donde esté indicada) y contacte inmediatamente con el anfitrión."]], ["Equipos eléctricos y técnicos", ["No desconecte sin autorización el router, repetidores Wi‑Fi, cámaras u otros equipos técnicos. Deben permanecer conectados durante la estancia.", "Si es necesario desconectar un equipo debido a una avería, contacte primero con el anfitrión.", "La iluminación LED decorativa se controla con el pequeño mando negro. Apúntelo hacia la esquina situada sobre el televisor y seleccione el color o modo deseado."]], ["Cafetera", ["Utilice únicamente agua potable embotellada en la cafetera, no agua del grifo.", "Llene el depósito, introduzca una cápsula y cierre la máquina.", "Pulse el botón del tamaño de taza deseado y espere hasta que deje de parpadear. Después pulse el mismo botón otra vez y comenzará a salir el café.", "Las cápsulas compatibles se venden en muchas tiendas. Lo más sencillo es hacer una foto del tipo de cápsula y comprar una igual."]], ["Plancha", ["Utilice únicamente agua destilada en el depósito de la plancha. El agua del grifo puede provocar cal, obstruir las salidas de vapor y dañar la plancha."]], ["Encimera de cocina", ["No corte alimentos directamente sobre la encimera. Utilice siempre las tablas de cortar disponibles.", "Los arañazos, cortes u otros daños pueden generar los costes reales de reparación o sustitución."]], ["Material de playa", ["Las sombrillas, sillas, juguetes y demás material de playa del apartamento están disponibles para todos los huéspedes.", "Después de usarlos, quite la arena y la suciedad, deje que se sequen y solo después guárdelos.", "No enrolle ni guarde artículos mojados, ya que pueden desarrollar moho y malos olores.", "Devuelva todo a su lugar para que también puedan utilizarlo los siguientes huéspedes."]], ["Piscina exterior comunitaria", ["La piscina exterior no es privada del apartamento; es una piscina comunitaria gestionada por la comunidad del edificio.", "Su mantenimiento, estado del agua, horarios, socorrista, mobiliario y zonas comunes no dependen directamente del propietario del apartamento.", "Se permiten tumbonas junto a la piscina, pero por falta de espacio no se guardan tumbonas permanentes en el apartamento. Si lo desea, puede comprar una tumbona hinchable o plegable económica en comercios locales."]], ["Ubicación, ruido urbano y vistas", ["El apartamento se encuentra en un edificio residencial en una zona atractiva cerca de Playa Los Locos. No es un complejo aislado ni está en pleno centro.", "Como en otras zonas residenciales, ocasionalmente pueden oírse camiones de basura, tráfico, vecinos, perros u otros sonidos normales de la ciudad. Con las ventanas cerradas el ruido exterior se reduce considerablemente.", "El apartamento no se anuncia con vistas directas al mar. Las fotos y la descripción del anuncio muestran la ubicación y el entorno reales."]], ["Puerta y cerradura inteligente", ["Después de introducir el código de 6 dígitos, espere aproximadamente 1–3 segundos. La cerradura se desbloqueará automáticamente y la puerta puede abrirse ligeramente.", "No empuje ni tire de la puerta con fuerza, ya que podría dañar el sistema automático de la cerradura.", "La luz del pasillo se enciende manualmente con los interruptores de pared."]], ["Cámaras de seguridad y privacidad", ["Hay dos cámaras de seguridad en la zona de entrada del apartamento. Solo supervisan la entrada / zona de acceso. No hay cámaras dentro del apartamento.", "Se utilizan para confirmar la llegada de los huéspedes registrados, detectar el acceso de personas no registradas y proteger los bienes del apartamento.", "Está estrictamente prohibido cubrir, desconectar, girar o interferir de cualquier forma con las cámaras. La interferencia deliberada con el sistema de seguridad puede considerarse una infracción grave y puede dar lugar a la finalización de la estancia conforme a las condiciones de la reserva.", "Si no existe incidente, disputa o necesidad justificada de conservar pruebas, las grabaciones no se conservan más tiempo del necesario después de la estancia y se eliminan según la configuración del sistema.", "La cerradura inteligente puede registrar eventos de apertura y cierre de la puerta por motivos de seguridad y cumplimiento de las normas."]], ["Impresora", ["La impresora del apartamento puede utilizarse para imprimir o copiar documentos personales e información útil.", "Úsela con cuidado. Los daños provocados por un uso incorrecto pueden descontarse del depósito según el coste real de reparación o sustitución."]], ["Depósito, daños y protección de bienes", ["El depósito de seguridad de 250 € es reembolsable cuando no existan deducciones justificadas después de la estancia. No es solo una retención formal: cuando sea necesario puede utilizarse para cubrir costes justificados por daños, bienes faltantes, limpieza adicional, huéspedes no registrados u otros costes derivados de estas normas.", "Si los costes justificados superan el depósito, podrá solicitarse el pago de la cantidad restante.", "Antes de entregar el apartamento a los huéspedes, su estado e inventario se documentan mediante fotografías y/o vídeo para dejar constancia del estado previo a la llegada.", "Las sospechas de robo o retirada deliberada de bienes pueden comunicarse a la policía."]], ["Salida", ["La salida es hasta las 11:00. El apartamento debe quedar completamente desocupado a esa hora para que el personal de limpieza pueda comenzar a trabajar.", "Antes de salir, apague las luces y el aire acondicionado innecesarios, cierre ventanas y puertas del balcón, recoja sus pertenencias y devuelva el inventario a su lugar.", "Una salida tardía puede generar costes adicionales si causa gastos extra a la empresa de limpieza u otro personal."]], ["Daños o pérdida de inventario", ["Las cantidades indicadas no representan únicamente el precio de venta del objeto. Pueden incluir tiempo del personal, desplazamientos y combustible, búsqueda y compra del repuesto, entrega, visita de técnico, desmontaje, instalación, limpieza adicional y otros costes reales de reposición.", "Si rompe o daña algo accidentalmente, contacte primero con el anfitrión. Cuando sea posible y previo acuerdo, puede comprar usted mismo un artículo idéntico o un repuesto adecuado y evitar parte de los costes adicionales."]]], "inventory_title": "Inventario y posibles cargos por daños", "inventory": [["Llaves y acceso", [["Llave electrónica / llavero", "50 €"], ["Cerradura inteligente", "500 €"], ["Forzar un armario cerrado", "250 €"]]], ["Electrónica y conectividad", [["Televisor", "300 €"], ["Mando de TV", "30 €"], ["Mando del aire acondicionado", "80 €"], ["Repetidor Wi‑Fi", "50 €"], ["Cámara de seguridad", "250 €"], ["Portero / interfono", "300 €"], ["Impresora", "coste real de reparación / sustitución"]]], ["Electrodomésticos de cocina", [["Placa de cocina", "600 €"], ["Horno", "800 €"], ["Frigorífico", "300 €"], ["Lavavajillas", "250 €"], ["Microondas", "100 €"], ["Hervidor", "80 €"], ["Cafetera", "150 €"]]], ["Baño y equipamiento doméstico", [["Lavadora", "300 €"], ["Tendedero / secador de ropa", "50 €"], ["Secador de pelo", "60 €"], ["Plancha", "80 €"], ["Ventilador", "150 €"], ["Dispensador del baño", "20 €"]]], ["Muebles", [["Sofá – dañado / roto", "800 €"], ["Sofá cama – limpieza profunda por suciedad intensa", "150 €"], ["Cama individual", "250 €"], ["Cama doble", "800 €"], ["Mesa – rota", "300 €"], ["Mesa auxiliar del salón", "80 €"], ["Mesita de noche", "50 €"], ["Silla de tocador", "50 €"], ["Silla de balcón", "50 €"], ["Mesa exterior", "80 €"], ["Caja / mueble para zapatos", "50 €"], ["Tocador / mesa de maquillaje", "250 €"]]], ["Interior", [["Espejo roto", "150 €"], ["Ventana o cristal roto", "600 €"], ["Jarrón", "20 €"], ["Lámpara / luminaria", "100 €"], ["Lámpara LED", "20 €"], ["Cuadro pequeño", "50 €"], ["Cuadro grande", "100 €"], ["Flor artificial", "50 €"]]], ["Cortinas", [["Cortina de día", "100 €"], ["Cortina opaca", "300 €"], ["Soporte de cortina", "25 €"]]], ["Menaje de cocina", [["Vajilla", "50–100 €"], ["Utensilios pequeños", "20 €"], ["Cristal de la mesa de comedor", "50 €"], ["Sartén", "80 €"], ["Olla quemada", "150 €"]]], ["Textiles", [["Toalla", "30 €"], ["Ropa de cama dañada sin reparación", "100 €"], ["Colcha", "100 €"], ["Almohada rota", "50 €"], ["Cojín de silla roto", "50 €"], ["Funda de muebles de exterior", "30 €"]]], ["Otros equipos", [["Calzador", "25 €"], ["Aspiradora", "250 €"], ["Cubo de basura roto", "20 €"]]]], "emergency": "Número de emergencias en España: 112", "contact": "Si surge un problema o algo no funciona, contacte con el anfitrión lo antes posible. Es mejor resolverlo durante la estancia."}, "ru": {"lang_name": "Русский", "title": "Evita Luxury Apartments – Near Playa Los Locos Beach with Pool", "subtitle": "Информация для гостей и правила проживания", "intro": "Добро пожаловать! Пожалуйста, уделите несколько минут этой информации. Она поможет комфортно пользоваться апартаментами и избежать недоразумений.", "important_title": "Самое важное", "important": ["Тихие часы: 22:00–08:00.", "Курить можно только на балконе. Курение и вейпинг внутри апартаментов строго запрещены.", "Ночевать могут только гости, зарегистрированные в бронировании. Незарегистрированный гость: 200 € за ночь с человека.", "Выезд до 11:00.", "Запрещено повреждать, закрывать или отключать двери, камеры, вентиляцию и другое техническое оборудование."], "sections": [["Тишина, балкон и соседи", ["Балкон предназначен для спокойного отдыха. Пожалуйста, не включайте громкую музыку, не танцуйте и не устраивайте шумные встречи.", "Для громкой музыки и развлечений пользуйтесь барами, клубами и другими предназначенными для этого местами.", "Тихие часы 22:00–08:00 действуют также на балконе, в коридорах и общих зонах.", "Запрещено выбрасывать с балкона предметы, окурки, пепел и мусор."]], ["Зарегистрированные гости и назначение апартаментов", ["Апартаменты предназначены для проживания и отдыха только лиц, указанных и зарегистрированных в бронировании.", "Дополнительные гости с ночёвкой допускаются только по предварительному согласованию с хозяином. Незарегистрированный гость: 200 € за ночь с человека.", "Коммерческие сексуальные услуги, проституция и аналогичная коммерческая деятельность в апартаментах запрещены. Серьёзные нарушения могут привести к прекращению проживания в соответствии с условиями бронирования."]], ["Курение и животные", ["Курить разрешается только на балконе.", "Внутри апартаментов строго запрещено курить обычные и электронные сигареты, а также использовать вейпы.", "Домашние животные не допускаются."]], ["Уличная обувь и профилактика насекомых", ["Не ходите по апартаментам в уличной обуви. На подошвах заносятся песок, уличная грязь, а также могут переноситься насекомые или их яйца.", "В тёплом климате Испании, особенно рядом с морем и водой, тараканы и другие насекомые иногда встречаются на улице и в общих зонах здания.", "В здании периодически проводится обработка от вредителей, а сами апартаменты дополнительно профилактически обрабатываются примерно каждые три месяца и по необходимости.", "Если вы заметили насекомых внутри апартаментов, как можно скорее сообщите хозяину."]], ["Балконные двери и шторы", ["Перед закрытием балконной двери убедитесь, что дневная или плотная штора не попала между дверью и рамой.", "Зажатая штора может порваться или быть повреждена без возможности ремонта. Ущерб из-за неправильного использования может быть взыскан согласно списку инвентаря."]], ["Кондиционер и циркуляция воздуха", ["В апартаментах установлена канальная система кондиционирования. Воздух поступает через решётки в стенах и потолке, поэтому отдельного настенного кондиционера в каждой комнате нет.", "Рекомендуемый режим: COOL / ❄ и примерно 24–25 °C. Если холодно – увеличьте температуру, если жарко – уменьшите.", "При работающем кондиционере держите окна и балконные двери закрытыми.", "Не закрывайте и не регулируйте вручную вентиляционные решётки, датчики и другие элементы системы."]], ["Ванная", ["После душа рекомендуется оставить окно ванной немного приоткрытым, чтобы не накапливалась влага. Дверь ванной при этом держите закрытой, чтобы тепло и влажность не распространялись по квартире.", "Зеркало имеет функцию подогрева / антизапотевания. Включите её, чтобы зеркало нагрелось и очистилось от конденсата."]], ["Использование воды", ["Пожалуйста, используйте воду разумно и не оставляйте её течь без необходимости.", "Расход воды в апартаментах учитывается, поэтому общий объём потребления за время проживания виден. Это не означает наблюдение за тем, когда и как вы пользуетесь водой – фиксируется только общий объём.", "Нормальный бытовой расход воды на человека, включая душ, мытьё посуды, стирку и другие нужды, хорошо известен, поэтому необычно высокий расход может быть замечен.", "При обнаружении протечки перекройте аварийный вентиль в ванной (слева над зеркалом, где отмечено) и сразу свяжитесь с хозяином."]], ["Электрическое и техническое оборудование", ["Не отключайте без разрешения роутер, усилители Wi‑Fi, камеры и другое техническое оборудование. Эти устройства должны оставаться подключёнными во время проживания.", "Если устройство необходимо отключить из-за неисправности, сначала свяжитесь с хозяином.", "Декоративная LED-подсветка управляется маленьким чёрным пультом. Направьте его в угол над телевизором и выберите нужный цвет или режим."]], ["Кофемашина", ["Используйте в кофемашине только питьевую воду из бутылки, не водопроводную.", "Налейте воду в резервуар, вставьте капсулу и закройте аппарат.", "Нажмите кнопку нужного размера чашки и дождитесь, пока она перестанет мигать. Затем нажмите ту же кнопку ещё раз – кофе начнёт наливаться.", "Подходящие капсулы продаются во многих магазинах. Проще всего сфотографировать тип капсулы и купить такую же."]], ["Утюг", ["В резервуар утюга заливайте только дистиллированную воду. Водопроводная вода может вызвать накипь, засорить паровые отверстия и повредить утюг."]], ["Кухонная столешница", ["Не режьте продукты прямо на столешнице. Всегда используйте разделочные доски.", "Царапины, порезы и другие повреждения могут привести к фактическим расходам на ремонт или замену."]], ["Пляжные принадлежности", ["Пляжные зонты, стулья, игрушки и другие вещи предназначены для всех гостей.", "После использования смойте песок и грязь, дайте вещам высохнуть и только после этого уберите их.", "Не сворачивайте и не храните мокрые вещи – из-за влаги может появиться плесень и неприятный запах.", "Верните всё на предназначенное место, чтобы этим могли пользоваться следующие гости."]], ["Общий открытый бассейн", ["Открытый бассейн не является частной частью апартаментов; это общий бассейн жилого комплекса.", "Его обслуживание, состояние воды, режим работы, спасатель, мебель и общие зоны не находятся под прямым контролем владельца апартаментов.", "Шезлонги у бассейна разрешены, но из-за ограниченного места постоянные шезлонги в квартире не хранятся. При желании недорогой надувной или складной шезлонг можно купить в местных магазинах."]], ["Расположение, городской шум и вид", ["Апартаменты находятся в жилом доме в привлекательном районе рядом с Playa Los Locos. Это не изолированный курорт и не самый центр города.", "Как и в других жилых районах, иногда могут быть слышны мусоровозы, транспорт, соседи, собаки и другие обычные городские звуки. При закрытых окнах внешний шум значительно уменьшается.", "Апартаменты не рекламируются как имеющие прямой вид на море. Фотографии и описание объявления показывают фактическое расположение и окружение."]], ["Дверь и умный замок", ["После ввода 6-значного кода подождите примерно 1–3 секунды. Замок откроется автоматически, и дверь может немного приоткрыться.", "Не толкайте и не тяните дверь силой – это может повредить автоматический механизм замка.", "Свет в коридоре включается вручную настенными выключателями."]], ["Камеры безопасности и конфиденциальность", ["У входа в апартаменты установлены две камеры безопасности. Они контролируют только вход / зону доступа. Внутри апартаментов камер нет.", "Камеры используются для подтверждения прибытия зарегистрированных гостей, выявления доступа незарегистрированных лиц и защиты имущества.", "Закрывать, отключать, поворачивать камеры или иным образом мешать их работе строго запрещено. Намеренное вмешательство в систему безопасности может считаться серьёзным нарушением и привести к прекращению проживания в соответствии с условиями бронирования.", "Если нет инцидента, спора или обоснованной необходимости сохранить доказательства, записи после проживания не хранятся дольше необходимого и удаляются согласно настройкам системы.", "Умный замок может регистрировать события открытия и закрытия двери в целях безопасности и соблюдения правил."]], ["Принтер", ["Принтером в апартаментах можно пользоваться для печати или копирования личных документов и полезной информации.", "Пользуйтесь им аккуратно. Повреждение из-за неправильного использования может быть компенсировано из депозита по фактической стоимости ремонта или замены."]], ["Депозит, ущерб и защита имущества", ["Залог 250 € возвращается, если после проживания нет обоснованных удержаний. Это не только формальный депозит: при необходимости он может использоваться для покрытия обоснованных расходов на ущерб, пропавшее имущество, дополнительную уборку, незарегистрированных гостей и другие расходы по этим правилам.", "Если обоснованные расходы превышают сумму депозита, может быть запрошена оплата оставшейся суммы.", "До передачи апартаментов гостям состояние и инвентарь фиксируются фотографиями и/или видео, чтобы задокументировать состояние до приезда.", "При подозрении на кражу или преднамеренный вынос имущества информация может быть передана полиции."]], ["Выезд", ["Выезд до 11:00. К этому времени апартаменты должны быть полностью освобождены, чтобы персонал по уборке мог начать работу.", "Перед выходом выключите ненужный свет и кондиционер, закройте окна и балконные двери, заберите личные вещи и верните имущество на место.", "Поздний выезд может повлечь дополнительные расходы, если из-за задержки клининговая компания или персонал несут дополнительные затраты."]], ["Повреждение или утрата имущества", ["Указанные суммы – это не только розничная цена предмета. В них могут входить рабочее время персонала, поездки и топливо, поиск и покупка замены, доставка, вызов мастера, демонтаж, монтаж, дополнительная уборка и другие реальные расходы.", "Если вы случайно что-то повредили или разбили, сначала свяжитесь с хозяином. Если возможно, после согласования вы можете самостоятельно купить точно такой же или подходящий предмет и тем самым избежать части дополнительных расходов."]]], "inventory_title": "Инвентарь и возможная компенсация ущерба", "inventory": [["Ключи и доступ", [["Электронный брелок", "50 €"], ["Умный дверной замок", "500 €"], ["Взлом закрытого шкафа", "250 €"]]], ["Электроника и связь", [["Телевизор", "300 €"], ["Пульт ТВ", "30 €"], ["Пульт кондиционера", "80 €"], ["Усилитель Wi‑Fi", "50 €"], ["Камера безопасности", "250 €"], ["Домофон", "300 €"], ["Принтер", "фактическая стоимость ремонта / замены"]]], ["Кухонная техника", [["Варочная панель", "600 €"], ["Духовка", "800 €"], ["Холодильник", "300 €"], ["Посудомоечная машина", "250 €"], ["Микроволновая печь", "100 €"], ["Чайник", "80 €"], ["Кофемашина", "150 €"]]], ["Ванная и бытовая техника", [["Стиральная машина", "300 €"], ["Сушилка для белья", "50 €"], ["Фен", "60 €"], ["Утюг", "80 €"], ["Вентилятор", "150 €"], ["Диспенсер в ванной", "20 €"]]], ["Мебель", [["Диван – повреждён / сломан", "800 €"], ["Диван-кровать – глубокая чистка при сильном загрязнении", "150 €"], ["Односпальная кровать", "250 €"], ["Двуспальная кровать", "800 €"], ["Стол – сломан", "300 €"], ["Столик в гостиной", "80 €"], ["Прикроватная тумбочка", "50 €"], ["Стул для туалетного столика", "50 €"], ["Балконный стул", "50 €"], ["Уличный стол", "80 €"], ["Ящик / тумба для обуви", "50 €"], ["Туалетный / косметический столик", "250 €"]]], ["Интерьер", [["Разбитое зеркало", "150 €"], ["Разбитое окно или стекло", "600 €"], ["Ваза", "20 €"], ["Светильник", "100 €"], ["LED-лампа", "20 €"], ["Небольшая картина", "50 €"], ["Большая картина", "100 €"], ["Искусственный цветок", "50 €"]]], ["Шторы", [["Дневная штора", "100 €"], ["Плотная штора", "300 €"], ["Держатель шторы", "25 €"]]], ["Кухонная посуда", [["Посуда", "50–100 €"], ["Мелкая кухонная утварь", "20 €"], ["Стекло обеденного стола", "50 €"], ["Сковорода", "80 €"], ["Сгоревшая кастрюля", "150 €"]]], ["Текстиль", [["Полотенце", "30 €"], ["Безвозвратно испорченное постельное бельё", "100 €"], ["Покрывало", "100 €"], ["Порванная подушка", "50 €"], ["Порванная подушка стула", "50 €"], ["Чехол уличной мебели", "30 €"]]], ["Прочее", [["Ложка для обуви", "25 €"], ["Пылесос", "250 €"], ["Сломанное мусорное ведро", "20 €"]]]], "emergency": "Экстренный номер в Испании: 112", "contact": "Если возникла проблема или что-то не работает, свяжитесь с хозяином как можно скорее. Лучше решить проблему во время проживания."}, "pl": {"lang_name": "Polski", "title": "Evita Luxury Apartments – Near Playa Los Locos Beach with Pool", "subtitle": "Informacje dla gości i zasady pobytu", "intro": "Witamy! Prosimy poświęcić kilka minut na przeczytanie tych informacji. Pomogą one wygodnie korzystać z apartamentu i uniknąć nieporozumień.", "important_title": "Najważniejsze", "important": ["Cisza nocna: 22:00–08:00.", "Palenie dozwolone jest tylko na balkonie. Palenie i używanie e-papierosów / vape wewnątrz apartamentu jest zabronione.", "Nocować mogą wyłącznie osoby zarejestrowane w rezerwacji. Niezarejestrowany gość: 200 € za noc za osobę.", "Wymeldowanie do godziny 11:00.", "Nie wolno uszkadzać, zasłaniać ani odłączać drzwi, kamer, wentylacji ani innych urządzeń technicznych."], "sections": [["Cisza, balkon i sąsiedzi", ["Balkon służy do spokojnego wypoczynku. Prosimy nie puszczać głośnej muzyki, nie tańczyć i nie organizować głośnych spotkań.", "Do głośnej muzyki i zabawy prosimy wybierać bary, kluby i inne miejsca rozrywki.", "Cisza nocna 22:00–08:00 obowiązuje również na balkonie, korytarzach i w częściach wspólnych.", "Nie wolno wyrzucać z balkonu przedmiotów, niedopałków, popiołu ani śmieci."]], ["Zarejestrowani goście i przeznaczenie apartamentu", ["Apartament jest przeznaczony do pobytu i wypoczynku wyłącznie osób wskazanych i zarejestrowanych w rezerwacji.", "Dodatkowe osoby nocujące wymagają wcześniejszej zgody gospodarza. Niezarejestrowany gość: 200 € za noc za osobę.", "W apartamencie zabronione są komercyjne usługi seksualne, prostytucja i podobna działalność. Poważne naruszenia mogą skutkować zakończeniem pobytu zgodnie z warunkami rezerwacji."]], ["Palenie i zwierzęta", ["Palenie dozwolone jest wyłącznie na balkonie.", "Wewnątrz apartamentu obowiązuje całkowity zakaz palenia papierosów, e-papierosów i używania vape.", "Zwierzęta nie są dozwolone."]], ["Obuwie zewnętrzne i zapobieganie owadom", ["Prosimy nie chodzić po apartamencie w obuwiu zewnętrznym. Buty wnoszą piasek i brud, a także mogą przenosić owady lub ich jaja.", "W ciepłym klimacie Hiszpanii, szczególnie blisko morza i wody, karaluchy i inne owady mogą czasami pojawiać się na zewnątrz i w częściach wspólnych budynku.", "W budynku wykonywane są okresowe zabiegi przeciw szkodnikom, a apartament jest dodatkowo profilaktycznie dezynsekowany mniej więcej co trzy miesiące i w razie potrzeby.", "Jeśli zauważysz owady w apartamencie, skontaktuj się z gospodarzem jak najszybciej."]], ["Drzwi balkonowe i zasłony", ["Przed zamknięciem drzwi balkonowych upewnij się, że firana lub zasłona nie została przytrzaśnięta między drzwiami a ramą.", "Przytrzaśnięta zasłona może zostać rozdarta lub trwale uszkodzona. Szkody wynikające z niewłaściwego użytkowania mogą być rozliczone zgodnie z cennikiem wyposażenia."]], ["Klimatyzacja i cyrkulacja powietrza", ["Apartament posiada kanałowy system klimatyzacji. Powietrze jest rozprowadzane przez kratki w ścianach i sufitach, dlatego w każdym pokoju nie ma oddzielnej jednostki ściennej.", "Zalecany jest tryb COOL / ❄ i temperatura około 24–25 °C. Jeśli jest za zimno – zwiększ temperaturę, jeśli za ciepło – zmniejsz.", "Podczas pracy klimatyzacji okna i drzwi balkonowe powinny być zamknięte.", "Nie zasłaniaj ani nie reguluj ręcznie kratek, czujników i innych elementów systemu."]], ["Łazienka", ["Po prysznicu zaleca się pozostawić okno łazienki lekko uchylone, aby ograniczyć wilgoć. Drzwi łazienki w tym czasie powinny być zamknięte, aby ciepło i wilgoć nie rozchodziły się po apartamencie.", "Lustro ma funkcję podgrzewania / przeciw parowaniu. Po jej włączeniu lustro się nagrzewa i usuwa zaparowanie."]], ["Zużycie wody", ["Prosimy korzystać z wody odpowiedzialnie i nie pozostawiać jej niepotrzebnie odkręconej.", "Zużycie wody w apartamencie jest mierzone, dlatego widoczne jest łączne zużycie podczas pobytu. Nie oznacza to monitorowania kiedy ani w jaki sposób korzystasz z wody – rejestrowana jest tylko całkowita ilość.", "Typowe dzienne zużycie wody na osobę, w tym prysznic, zmywanie, pranie i inne potrzeby, jest znane, więc wyjątkowo wysokie zużycie może zostać zauważone.", "W przypadku wycieku zakręć awaryjny zawór w łazience (po lewej stronie nad lustrem, jeśli oznaczony) i natychmiast skontaktuj się z gospodarzem."]], ["Urządzenia elektryczne i techniczne", ["Nie odłączaj samodzielnie routera, wzmacniaczy Wi‑Fi, kamer ani innego sprzętu technicznego. Urządzenia te muszą pozostać podłączone podczas pobytu.", "Jeżeli urządzenie trzeba odłączyć z powodu usterki, najpierw skontaktuj się z gospodarzem.", "Dekoracyjne oświetlenie LED sterowane jest małym czarnym pilotem. Skieruj go w stronę narożnika nad telewizorem i wybierz kolor lub tryb."]], ["Ekspres do kawy", ["Do ekspresu używaj wyłącznie butelkowanej wody pitnej, nie wody z kranu.", "Napełnij zbiornik, włóż kapsułkę i zamknij ekspres.", "Naciśnij przycisk odpowiedniej wielkości filiżanki i poczekaj, aż przestanie migać. Następnie naciśnij ten sam przycisk ponownie – kawa zacznie się nalewać.", "Pasujące kapsułki są dostępne w wielu sklepach. Najłatwiej zrobić zdjęcie używanej kapsułki i kupić taką samą."]], ["Żelazko", ["Do zbiornika żelazka używaj wyłącznie wody destylowanej. Woda z kranu może powodować osadzanie się kamienia, zatkanie otworów parowych i uszkodzenie żelazka."]], ["Blat kuchenny", ["Nie kroj żywności bezpośrednio na blacie. Zawsze używaj desek do krojenia.", "Zarysowania, nacięcia i inne uszkodzenia mogą skutkować rzeczywistymi kosztami naprawy lub wymiany."]], ["Wyposażenie plażowe", ["Parasol, krzesła, zabawki i inne wyposażenie plażowe w apartamencie jest przeznaczone dla wszystkich gości.", "Po użyciu usuń piasek i brud, pozostaw rzeczy do wyschnięcia i dopiero potem je schowaj.", "Nie zwijaj i nie chowaj mokrych rzeczy – wilgoć może spowodować pleśń i nieprzyjemny zapach.", "Odłóż wszystko na miejsce, aby mogli z tego korzystać kolejni goście."]], ["Wspólny basen zewnętrzny", ["Basen zewnętrzny nie jest prywatną częścią apartamentu; jest wspólnym basenem wspólnoty budynku.", "Jego utrzymanie, stan wody, godziny otwarcia, ratownik, meble i części wspólne nie są bezpośrednio kontrolowane przez właściciela apartamentu.", "Leżaki przy basenie są dozwolone, ale z powodu ograniczonego miejsca w apartamencie nie przechowuje się stałych leżaków. W razie potrzeby można lokalnie kupić niedrogi leżak dmuchany lub składany."]], ["Lokalizacja, odgłosy miasta i widok", ["Apartament znajduje się w budynku mieszkalnym w atrakcyjnej okolicy blisko Playa Los Locos. Nie jest to odizolowany resort ani ścisłe centrum.", "Jak w innych dzielnicach mieszkalnych, czasem mogą być słyszalne śmieciarki, ruch uliczny, sąsiedzi, psy i inne zwykłe odgłosy miasta. Po zamknięciu okien hałas zewnętrzny znacznie się zmniejsza.", "Apartament nie jest reklamowany jako posiadający bezpośredni widok na morze. Zdjęcia i opis oferty pokazują rzeczywistą lokalizację i otoczenie."]], ["Drzwi i inteligentny zamek", ["Po wpisaniu 6-cyfrowego kodu odczekaj około 1–3 sekund. Zamek otworzy się automatycznie, a drzwi mogą lekko uchylić się same.", "Nie pchaj ani nie ciągnij drzwi siłą – może to uszkodzić automatyczny mechanizm zamka.", "Światło na korytarzu włącza się ręcznie przełącznikami na ścianie."]], ["Kamery bezpieczeństwa i prywatność", ["Przy wejściu do apartamentu znajdują się dwie kamery bezpieczeństwa. Obejmują wyłącznie wejście / strefę dostępu. Wewnątrz apartamentu nie ma kamer.", "Służą do potwierdzenia przybycia zarejestrowanych gości, wykrywania wejścia osób niezarejestrowanych oraz ochrony mienia.", "Zasłanianie, odłączanie, obracanie lub inne zakłócanie pracy kamer jest surowo zabronione. Celowe ingerowanie w system bezpieczeństwa może zostać uznane za poważne naruszenie i skutkować zakończeniem pobytu zgodnie z warunkami rezerwacji.", "Jeżeli nie ma incydentu, sporu ani uzasadnionej potrzeby zachowania dowodów, nagrania po zakończeniu pobytu nie są przechowywane dłużej niż to konieczne i są usuwane zgodnie z ustawieniami systemu.", "Inteligentny zamek może rejestrować zdarzenia otwarcia i zamknięcia drzwi w celach bezpieczeństwa i egzekwowania zasad."]], ["Drukarka", ["Drukarka w apartamencie może służyć do drukowania lub kopiowania dokumentów osobistych i przydatnych informacji.", "Prosimy korzystać z niej ostrożnie. Uszkodzenie spowodowane niewłaściwym użyciem może zostać potrącone z kaucji według rzeczywistych kosztów naprawy lub wymiany."]], ["Kaucja, szkody i ochrona mienia", ["Kaucja 250 € jest zwrotna, jeśli po pobycie nie ma uzasadnionych potrąceń. Nie jest to tylko formalna blokada – w razie potrzeby może zostać wykorzystana na pokrycie uzasadnionych kosztów szkód, brakującego mienia, dodatkowego sprzątania, niezarejestrowanych gości lub innych kosztów wynikających z tych zasad.", "Jeżeli uzasadnione koszty przekraczają wartość kaucji, może zostać zażądana pozostała kwota.", "Przed przekazaniem apartamentu gościom jego stan i wyposażenie są dokumentowane zdjęciami i/lub nagraniem wideo, aby utrwalić stan przed przyjazdem.", "W przypadku podejrzenia kradzieży lub celowego wyniesienia mienia sprawa może zostać zgłoszona policji."]], ["Wymeldowanie", ["Wymeldowanie jest do godziny 11:00. Do tego czasu apartament musi być całkowicie opuszczony, aby personel sprzątający mógł rozpocząć pracę.", "Przed wyjściem wyłącz niepotrzebne światła i klimatyzację, zamknij okna i drzwi balkonowe, zabierz rzeczy osobiste i odłóż wyposażenie na miejsce.", "Spóźnione wymeldowanie może spowodować dodatkowe koszty, jeśli opóźnienie generuje koszty dla firmy sprzątającej lub innego personelu."]], ["Uszkodzenie lub utrata wyposażenia", ["Podane kwoty nie są wyłącznie ceną sklepową przedmiotu. Mogą obejmować czas personelu, przejazd i paliwo, wyszukanie i zakup zamiennika, dostawę, wezwanie fachowca, demontaż, montaż, dodatkowe sprzątanie i inne rzeczywiste koszty.", "Jeżeli przypadkowo coś uszkodzisz lub stłuczesz, najpierw skontaktuj się z gospodarzem. Jeżeli jest to możliwe i wcześniej uzgodnione, możesz samodzielnie kupić taki sam lub odpowiedni zamiennik i uniknąć części dodatkowych kosztów."]]], "inventory_title": "Wyposażenie i możliwe opłaty za szkody", "inventory": [["Klucze i dostęp", [["Brelok / żeton wejściowy", "50 €"], ["Inteligentny zamek", "500 €"], ["Włamanie do zamkniętej szafki", "250 €"]]], ["Elektronika i łączność", [["Telewizor", "300 €"], ["Pilot TV", "30 €"], ["Pilot klimatyzacji", "80 €"], ["Wzmacniacz Wi‑Fi", "50 €"], ["Kamera bezpieczeństwa", "250 €"], ["Domofon", "300 €"], ["Drukarka", "rzeczywisty koszt naprawy / wymiany"]]], ["Sprzęt kuchenny", [["Płyta grzewcza", "600 €"], ["Piekarnik", "800 €"], ["Lodówka", "300 €"], ["Zmywarka", "250 €"], ["Mikrofalówka", "100 €"], ["Czajnik", "80 €"], ["Ekspres do kawy", "150 €"]]], ["Łazienka i sprzęt domowy", [["Pralka", "300 €"], ["Suszarka / stojak na pranie", "50 €"], ["Suszarka do włosów", "60 €"], ["Żelazko", "80 €"], ["Wentylator", "150 €"], ["Dozownik łazienkowy", "20 €"]]], ["Meble", [["Sofa – uszkodzona / złamana", "800 €"], ["Sofa rozkładana – pranie głębokie przy silnym zabrudzeniu", "150 €"], ["Łóżko pojedyncze", "250 €"], ["Łóżko podwójne", "800 €"], ["Stół – złamany", "300 €"], ["Stolik w salonie", "80 €"], ["Stolik nocny", "50 €"], ["Krzesło do toaletki", "50 €"], ["Krzesło balkonowe", "50 €"], ["Stół zewnętrzny", "80 €"], ["Pojemnik / szafka na buty", "50 €"], ["Toaletka / stolik kosmetyczny", "250 €"]]], ["Wnętrze", [["Rozbite lustro", "150 €"], ["Rozbite okno lub szkło", "600 €"], ["Wazon", "20 €"], ["Lampa", "100 €"], ["Lampa LED", "20 €"], ["Mały obraz", "50 €"], ["Duży obraz", "100 €"], ["Sztuczny kwiat", "50 €"]]], ["Zasłony", [["Firanka", "100 €"], ["Zasłona zaciemniająca", "300 €"], ["Uchwyt do zasłony", "25 €"]]], ["Naczynia kuchenne", [["Naczynia", "50–100 €"], ["Drobne przybory kuchenne", "20 €"], ["Szkło stołu jadalnego", "50 €"], ["Patelnia", "80 €"], ["Przypalony garnek", "150 €"]]], ["Tekstylia", [["Ręcznik", "30 €"], ["Trwale uszkodzona pościel", "100 €"], ["Narzuta", "100 €"], ["Podarta poduszka", "50 €"], ["Podarta poduszka krzesła", "50 €"], ["Pokrowiec mebli zewnętrznych", "30 €"]]], ["Inne wyposażenie", [["Łyżka do butów", "25 €"], ["Odkurzacz", "250 €"], ["Uszkodzony kosz na śmieci", "20 €"]]]], "emergency": "Numer alarmowy w Hiszpanii: 112", "contact": "Jeśli pojawi się problem lub coś nie działa, skontaktuj się z gospodarzem jak najszybciej. Najlepiej rozwiązać problem podczas pobytu."}};
const supported=["lt","en","es","ru","pl"];
function browserLang(){
  const raw=(navigator.languages&&navigator.languages[0])||navigator.language||"en";
  return raw.toLowerCase().split("-")[0];
}
function maybeAutoTranslate(lang){
  if(supported.includes(lang)) return false;
  if(!/^https?:$/.test(location.protocol)) return false;
  if(location.hostname.includes("translate.goog") || location.hostname==="translate.google.com") return false;
  const target=encodeURIComponent(location.href);
  const translateUrl=`https://translate.google.com/translate?sl=auto&tl=${encodeURIComponent(lang)}&u=${target}`;
  location.replace(translateUrl);
  return true;
}
function render(lang,manual=false){
  const t=T[lang]||T.en;
  document.documentElement.lang=lang;
  document.getElementById("lang").value=lang;
  document.getElementById("autoBadge").style.display=manual?"none":"inline-block";
  title.textContent=t.title; subtitle.textContent=t.subtitle; intro.textContent=t.intro;
  importantTitle.textContent=t.important_title;
  importantList.innerHTML=t.important.map(x=>`<li>${x}</li>`).join("");
  sections.innerHTML=t.sections.map(([head,items])=>`
    <details>
      <summary>${head}</summary>
      <div class="content"><ul>${items.map(x=>`<li>${x}</li>`).join("")}</ul></div>
    </details>`).join("");
  inventoryTitle.textContent=t.inventory_title;
  inventory.innerHTML=(t.inventory||[]).map(([group,items])=>`
    <div class="inv-group"><h3>${group}</h3><table>${items.map(([n,p])=>`<tr><td>${n}</td><td>${p}</td></tr>`).join("")}</table></div>`).join("");
  emergency.textContent=t.emergency; contact.textContent=t.contact;
}
const saved=localStorage.getItem("evita_lang");
const detected=browserLang();
if(!saved && maybeAutoTranslate(detected)){
  // Unsupported browser language: Google Translate opens the page in that language.
} else {
  const initial=saved&&supported.includes(saved)?saved:(supported.includes(detected)?detected:"en");
  render(initial,!!saved);
}
lang.addEventListener("change",e=>{localStorage.setItem("evita_lang",e.target.value);render(e.target.value,true);});
</script>
